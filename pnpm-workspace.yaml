packages:
  - "packages/*"
  - "apps/*"

autoInstallPeers: true
strictPeerDependencies: false

# Dependencias autorizadas a ejecutar scripts de instalación.
allowBuilds:
  esbuild: true

# Versiones publicadas hace poco que necesitamos antes de que pase el periodo de espera de pnpm.
minimumReleaseAgeExclude:
  - "@fumadocs/base-ui@16.15.14"
  - fumadocs-core@16.15.14
  - fumadocs-mdx@15.4.4
