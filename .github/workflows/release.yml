name: Release

# Publicación con Changesets:
# 1. Cada cambio en los paquetes añade un changeset (`pnpm changeset`).
# 2. Tras cerrar calidad, ejecutar manualmente para abrir o actualizar el PR de versiones.
# 3. Tras integrar ese PR, otra ejecución manual publica en npm y crea etiquetas y releases.
# Requiere el secreto NPM_TOKEN (token de automatización de npm con permiso sobre @betterlibs).

on:
  workflow_dispatch:

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Revisión manual de lectores de pantalla
        run: node scripts/check-manual-a11y.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      - run: pnpm lint:packages
      - run: pnpm test:e2e
      - name: Referencias visuales Linux obligatorias
        run: pnpm test:visual
      - run: pnpm lighthouse
      - uses: changesets/action@v1
        with:
          title: 'chore: versión de los paquetes'
          commit: 'chore: versión de los paquetes'
          version: pnpm version-packages
          publish: pnpm release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
